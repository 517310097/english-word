<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小学英语单词练习</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Comic Sans MS", "Yuanti SC", "YouYuan", "幼圆", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 50%, #E0F6FF 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }

  /* ===== 顶部标题栏 ===== */
  .header {
    width: 100%;
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .title {
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  }
  .score-box {
    background: rgba(255,255,255,0.9);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 16px;
    color: #333;
    font-weight: bold;
  }
  .score-box span { color: #FF6B6B; }

  /* ===== 主卡片 ===== */
  .card {
    width: 100%;
    max-width: 600px;
    background: #fff;
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    text-align: center;
  }

  /* ===== 进度条 ===== */
  .progress-bar {
    width: 100%;
    height: 12px;
    background: #E8F4FD;
    border-radius: 6px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ECDC4, #44B0E0);
    border-radius: 6px;
    transition: width 0.4s ease;
    width: 0%;
  }
  .progress-text {
    font-size: 14px;
    color: #888;
    margin-bottom: 10px;
  }

  /* ===== 中文提示 ===== */
  .chinese-word {
    font-size: 42px;
    font-weight: bold;
    color: #2C3E50;
    margin-bottom: 10px;
  }
  .word-hint {
    font-size: 16px;
    color: #999;
    margin-bottom: 30px;
  }

  /* ===== 字母方框 ===== */
  .letter-boxes {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }
  .letter-box {
    width: 56px;
    height: 60px;
    border: 3px solid #BDD7EE;
    border-radius: 12px;
    background: #F8FBFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    color: #2C3E50;
    text-transform: lowercase;
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .letter-box.active {
    border-color: #44B0E0;
    background: #E3F2FD;
    box-shadow: 0 0 12px rgba(68,176,224,0.4);
  }
  .letter-box.correct {
    border-color: #52C41A;
    background: #F6FFED;
    color: #389E0D;
  }
  .letter-box.wrong {
    border-color: #FF4D4F;
    background: #FFF1F0;
    color: #CF1322;
    animation: shake 0.4s ease;
  }
  .letter-box.revealed {
    border-color: #FAAD14;
    background: #FFFBE6;
    color: #D48806;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  /* ===== 按钮区 ===== */
  .buttons {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
  }
  .btn {
    padding: 12px 28px;
    border: none;
    border-radius: 25px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.95); }
  .btn-hint {
    background: #FFF7E6;
    color: #D48806;
    border: 2px solid #FFD591;
  }
  .btn-hint:hover { background: #FFF1B8; }
  .btn-skip {
    background: #F0F0F0;
    color: #666;
  }
  .btn-skip:hover { background: #E0E0E0; }
  .btn-next {
    background: #4ECDC4;
    color: #fff;
  }
  .btn-next:hover { background: #3DBDB4; }

  /* ===== 完成庆祝 ===== */
  .celebrate {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #F6FFED;
    border-radius: 15px;
    color: #389E0D;
    font-size: 20px;
    font-weight: bold;
  }
  .celebrate.show { display: block; animation: pop 0.4s ease; }
  @keyframes pop {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ===== 结算页面 ===== */
  .result-page {
    display: none;
    text-align: center;
  }
  .result-page.show { display: block; }
  .result-emoji {
    font-size: 80px;
    margin-bottom: 20px;
  }
  .result-title {
    font-size: 32px;
    color: #2C3E50;
    margin-bottom: 15px;
  }
  .result-detail {
    font-size: 18px;
    color: #666;
    line-height: 2;
    margin-bottom: 30px;
  }
  .result-detail strong { color: #FF6B6B; font-size: 24px; }

  /* ===== 彩虹装饰 ===== */
  .cloud {
    position: fixed;
    font-size: 40px;
    opacity: 0.6;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }
  .cloud1 { top: 10%; left: 5%; animation-delay: 0s; }
  .cloud2 { top: 20%; right: 8%; animation-delay: 2s; }
  .cloud3 { bottom: 15%; left: 10%; animation-delay: 4s; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  /* 隐藏的输入框，用于接收键盘 */
  .hidden-input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
    left: -9999px;
  }

  @media (max-width: 480px) {
    .card { padding: 25px 15px; }
    .chinese-word { font-size: 32px; }
    .letter-box { width: 42px; height: 48px; font-size: 24px; gap: 6px; }
    .title { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="cloud cloud1">☁️</div>
<div class="cloud cloud2">☁️</div>
<div class="cloud cloud3">☁️</div>

<div class="header">
  <div class="title">📚 英语单词练习</div>
  <div class="score-box">得分：<span id="score">0</span></div>
</div>

<div class="card">
  <!-- 练习页面 -->
  <div id="practice-page">
    <div class="progress-text">第 <span id="current-num">1</span> / <span id="total-num">10</span> 题</div>
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

    <div class="chinese-word" id="chinese">苹果</div>
    <div class="word-hint">请输入对应的英语单词</div>

    <div class="letter-boxes" id="boxes"></div>

    <div class="buttons">
      <button class="btn btn-hint" onclick="showHint()">💡 提示</button>
      <button class="btn btn-skip" onclick="skipWord()">⏭ 跳过</button>
    </div>

    <div class="celebrate" id="celebrate">🎉 太棒了！答对啦！</div>
  </div>

  <!-- 结算页面 -->
  <div class="result-page" id="result-page">
    <div class="result-emoji" id="result-emoji">🏆</div>
    <div class="result-title" id="result-title">练习完成！</div>
    <div class="result-detail">

    </div>
    <button class="btn btn-next" onclick="restart()">🔄 再练一次</button>
  </div>
</div>

<input type="text" class="hidden-input" id="hidden-input" autocomplete="off" autocapitalize="off">

// ===== 状态 =====
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let answeredWords = [];
let currentWord = "";
let currentCn = "";
let currentPos = 0;
let hintUsed = false;
let isCorrect = false;
let shuffledWords = [];

// ===== 初始化 =====
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function init() {
  shuffledWords = shuffle(WORD_BANK).slice(0, 50);
  currentIndex = 0;
  score = 0;
  correctCount = 0;
  answeredWords = [];
  document.getElementById("score").textContent = score;
  document.getElementById("total-num").textContent = shuffledWords.length;
  document.getElementById("practice-page").style.display = "block";
  document.getElementById("result-page").classList.remove("show");
  loadWord();
}

function loadWord() {
  const item = shuffledWords[currentIndex];
  currentWord = item.word.toLowerCase();
  currentCn = item.cn;
  currentPos = 0;
  hintUsed = false;
  isCorrect = false;

  document.getElementById("chinese").textContent = currentCn;
  document.getElementById("current-num").textContent = currentIndex + 1;
  document.getElementById("progress").style.width = (currentIndex / shuffledWords.length * 100) + "%";
  document.getElementById("celebrate").classList.remove("show");

  // 生成方框
  const boxesEl = document.getElementById("boxes");
  boxesEl.innerHTML = "";
  for (let i = 0; i < currentWord.length; i++) {
    const box = document.createElement("div");
    box.className = "letter-box";
    box.dataset.index = i;
    box.addEventListener("click", () => focusBox(i));
    boxesEl.appendChild(box);
  }
  focusBox(0);

  // 自动聚焦隐藏输入框
  setTimeout(() => document.getElementById("hidden-input").focus(), 100);
}

function focusBox(i) {
  document.querySelectorAll(".letter-box").forEach((b, idx) => {
    b.classList.toggle("active", idx === i);
  });
  currentPos = i;
}

// ===== 键盘输入处理 =====
document.getElementById("hidden-input").addEventListener("input", function(e) {
  const val = e.target.value.toLowerCase();
  e.target.value = "";
  if (!val || !/^[a-z]$/.test(val)) return;
  handleLetter(val);
});

// 也支持直接键盘按键（不依赖输入框聚焦）
document.addEventListener("keydown", function(e) {
  if (document.getElementById("result-page").classList.contains("show")) return;
  if (e.key === "Backspace") {
    e.preventDefault();
    handleBackspace();
    return;
  }
  if (/^[a-zA-Z]$/.test(e.key)) {
    e.preventDefault();
    handleLetter(e.key.toLowerCase());
  }
});

function handleLetter(letter) {
  if (isCorrect) return;
  const boxes = document.querySelectorAll(".letter-box");
  const box = boxes[currentPos];
  if (!box || box.classList.contains("correct")) {
    // 找下一个空框
    for (let i = 0; i < boxes.length; i++) {
      if (!boxes[i].classList.contains("correct") && !boxes[i].textContent) {
        focusBox(i);
        break;
      }
    }
    return;
  }

  box.textContent = letter;
  if (letter === currentWord[currentPos]) {
    box.classList.remove("active");
    box.classList.add("correct");
    currentPos++;
    if (currentPos < boxes.length) {
      boxes[currentPos].classList.add("active");
    }
    // 检查是否全部完成
    if (currentPos >= boxes.length) {
      wordComplete();
    }
  } else {
    box.classList.add("wrong");
    setTimeout(() => {
      box.classList.remove("wrong");
      box.textContent = "";
    }, 500);
  }
}

function handleBackspace() {
  const boxes = document.querySelectorAll(".letter-box");
  // 从当前位置往前找一个可删除的
  for (let i = currentPos; i >= 0; i--) {
    if (boxes[i] && !boxes[i].classList.contains("correct") && boxes[i].textContent) {
      boxes[i].textContent = "";
      boxes[i].classList.remove("wrong");
      focusBox(i);
      return;
    }
  }
}

function wordComplete() {
  isCorrect = true;
  correctCount++;
  const gain = hintUsed ? 5 : 10;
  score += gain;
  document.getElementById("score").textContent = score;

  const celebrate = document.getElementById("celebrate");
  celebrate.textContent = hintUsed ? `👍 答对了！+${gain}分` : `🎉 太棒了！+${gain}分`;
  celebrate.classList.add("show");

  setTimeout(() => {
    nextWord();
  }, 1500);
}

function showHint() {
  if (hintUsed || isCorrect) return;
  hintUsed = true;
  const boxes = document.querySelectorAll(".letter-box");
  // 找第一个还没填对的框，显示正确字母
  for (let i = 0; i < boxes.length; i++) {
    if (!boxes[i].classList.contains("correct")) {
      boxes[i].textContent = currentWord[i];
      boxes[i].classList.add("revealed");
      boxes[i].classList.remove("active");
      // 跳到下一个框
      for (let j = i + 1; j < boxes.length; j++) {
        if (!boxes[j].classList.contains("correct")) {
          boxes[j].classList.add("active");
          currentPos = j;
          break;
        }
      }
      // 如果后面没有空框了，检查是否完成
      let allDone = true;
      for (let k = 0; k < boxes.length; k++) {
        if (!boxes[k].classList.contains("correct") && !boxes[k].classList.contains("revealed")) {
          allDone = false;
          break;
        }
      }
      if (allDone) {
        // 所有框都填了，标记为正确
        boxes.forEach(b => {
          b.classList.remove("revealed");
          b.classList.add("correct");
        });
        wordComplete();
      }
      break;
    }
  }
}

function skipWord() {
  nextWord();
}

function nextWord() {
  currentIndex++;
  if (currentIndex >= shuffledWords.length) {
    showResult();
  } else {
    loadWord();
  }
}

function showResult() {
  document.getElementById("practice-page").style.display = "none";
  document.getElementById("result-page").classList.add("show");
  document.getElementById("final-correct").textContent = correctCount;
  document.getElementById("final-total").textContent = shuffledWords.length;
  const rate = Math.round(correctCount / shuffledWords.length * 100);
  document.getElementById("final-rate").textContent = rate + "%";

  const emoji = document.getElementById("result-emoji");
  const title = document.getElementById("result-title");
  if (rate >= 90) {
    emoji.textContent = "🏆";
    title.textContent = "太厉害了！";
  } else if (rate >= 60) {
    emoji.textContent = "👍";
    title.textContent = "不错哦，继续加油！";
  } else {
    emoji.textContent = "💪";
    title.textContent = "多多练习会更好！";
  }
}

function restart() {
  init();
}

// 点击卡片任意地方聚焦输入
document.querySelector(".card").addEventListener("click", function() {
  if (!document.getElementById("result-page").classList.contains("show")) {
    document.getElementById("hidden-input").focus();
  }
});
